<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Plickers System - Нэвтрэх</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
    h2 { text-align: center; color: #333; margin-top: 0; }
    input, select, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Системд Нэвтрэх</h2>
    <input type="text" id="username" placeholder="Хэрэглэгчийн нэр">
    <input type="password" id="password" placeholder="Нууц үг">
    <button onclick="login()">Нэвтрэх</button>
  </div>

  <script>
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('user', JSON.stringify(data));
        if (data.role === 'ADMIN') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'teacher.html';
        }
      } else {
        alert(data.message);
      }
    }
  </script>
</body>
</html>
