<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ - Багш нарын удирдлага</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; }
    .header h2 { margin: 0; color: #2c3e50; }
    
    .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .section-title h3 { margin: 0; color: #34495e; }

    .btn-add { background-color: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-logout { background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { opacity: 0.9; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: left; font-size: 14px; }
    th { background-color: #f8f9fa; color: #333; font-weight: 600; }
    
    .password-box { display: flex; align-items: center; gap: 8px; }
    .password-text { font-family: monospace; font-size: 15px; letter-spacing: 1px; }
    .btn-toggle { background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; }

    .btn-action { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; margin-right: 5px; }
    .btn-edit { background-color: #ffc107; color: #212529; }
    .btn-delete { background-color: #dc3545; color: white; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index: 1000; }
    .modal-content { background:white; padding:25px; border-radius:8px; width:90%; max-width:400px; }
    .modal-content h3 { margin-top:0; color:#2c3e50; }
    .modal-content input { width:100%; padding:10px; margin:8px 0 15px 0; border:1px solid #ccc; border-radius:6px; font-size:14px; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>👑 Админ - Багш нарын удирдлага</h2>
    <button class="btn-logout" onclick="logout()">Гарах</button>
  </div>

  <div class="section-title">
    <h3>📋 Бүртгэлтэй багш нар</h3>
    <button class="btn-add" onclick="openAddModal()">➕ Багш нэмэх</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>№</th>
        <th>Хэрэглэгчийн нэр</th>
        <th>Нууц үг</th>
        <th>Үйлдэл</th>
      </tr>
    </thead>
    <tbody id="teacherTableBody">
      <tr><td colspan="4">Уншиж байна...</td></tr>
    </tbody>
  </table>
</div>

<!-- 1. Шинэ Багш Нэмэх Модал Цонх -->
<div id="addTeacherModal" class="modal">
  <div class="modal-content">
    <h3>➕ Шинэ багш бүртгэх</h3>
    <label style="font-size: 13px; color: #555;">Хэрэглэгчийн нэр:</label>
    <input type="text" id="addUsernameInput" placeholder="dulam_teacher">
    
    <label style="font-size: 13px; color: #555;">Нууц үг:</label>
    <input type="text" id="addPasswordInput" placeholder="Нууц үг зааж өгөх">
    
    <div class="modal-actions">
      <button class="btn-action" style="background:#6c757d; color:white;" onclick="closeAddModal()">Цуцлах</button>
      <button class="btn-action" style="background:#28a745; color:white;" onclick="saveNewTeacher()">Бүртгэх</button>
    </div>
  </div>
</div>

<!-- 2. Нууц үг солих Модал Цонх -->
<div id="passwordModal" class="modal">
  <div class="modal-content">
    <h3>🔑 Нууц үг солих</h3>
    <p id="modalTeacherName" style="font-weight: bold; color: #555;"></p>
    <input type="text" id="newPasswordInput" placeholder="Шинэ нууц үг бичнэ үү">
    <div class="modal-actions">
      <button class="btn-action" style="background:#6c757d; color:white;" onclick="closePasswordModal()">Цуцлах</button>
      <button class="btn-action" style="background:#28a745; color:white;" onclick="savePassword()">Хадгалах</button>
    </div>
  </div>
</div>

<script>
  let selectedTeacherId = null;

  // 1. Багш нарын жагсаалтыг татах
  async function fetchTeachers() {
    try {
      const res = await fetch('/api/admin/teachers');
      const teachers = await res.json();

      const tbody = document.getElementById('teacherTableBody');
      if (!Array.isArray(teachers) || teachers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">Бүртгэлтэй багш олдсонгүй.</td></tr>';
        return;
      }

      tbody.innerHTML = teachers.map((teacher, index) => `
        <tr>
          <td>${index + 1}</td>
          <td><b>${teacher.username}</b></td>
          <td>
            <div class="password-box">
              <span class="password-text" id="pass-${teacher.id}">••••••••</span>
              <button class="btn-toggle" onclick="togglePassword('${teacher.id}', '${teacher.password}')" title="Нууц үг харах/нуух">👁️</button>
            </div>
          </td>
          <td>
            <button class="btn-action btn-edit" onclick="openPasswordModal('${teacher.id}', '${teacher.username}')">🔑 Нууц үг солих</button>
            <button class="btn-action btn-delete" onclick="deleteTeacher('${teacher.id}', '${teacher.username}')">🗑️ Устгах</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      console.error(err);
      document.getElementById('teacherTableBody').innerHTML = '<tr><td colspan="4" style="color:red;">Өгөгдөл татахад алдаа гарлаа. Сервер ажиллаж байгааг шалгана уу.</td></tr>';
    }
  }

  // 2. Нууц үг харах / нуух
  function togglePassword(id, realPassword) {
    const el = document.getElementById(`pass-${id}`);
    if (el.innerText === '••••••••') {
      el.innerText = realPassword;
    } else {
      el.innerText = '••••••••';
    }
  }

  // 3. Шинэ Багш нэмэх Модал
  function openAddModal() {
    document.getElementById('addUsernameInput').value = '';
    document.getElementById('addPasswordInput').value = '';
    document.getElementById('addTeacherModal').style.display = 'flex';
  }

  function closeAddModal() {
    document.getElementById('addTeacherModal').style.display = 'none';
  }

  async function saveNewTeacher() {
    const username = document.getElementById('addUsernameInput').value.trim();
    const password = document.getElementById('addPasswordInput').value.trim();

    if (!username || !password) {
      alert('Хэрэглэгчийн нэр болон нууц үгийг заавал оруулна уу!');
      return;
    }

    try {
      const res = await fetch('/api/admin/teachers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        alert(data.message);
        closeAddModal();
        fetchTeachers();
      } else {
        alert(data.message || 'Багш нэмэхэд алдаа гарлаа.');
      }
    } catch (err) {
      alert('Сервертэй холбогдоход алдаа гарлаа.');
    }
  }

  // 1. Нууц үг солих Модал цонх нээх
function openPasswordModal(id, username) {
  selectedTeacherId = id; // Сонгосон багшийн ID-г хадгалах
  document.getElementById('modalTeacherName').innerText = `Багш: ${username}`;
  document.getElementById('newPasswordInput').value = '';
  document.getElementById('passwordModal').style.display = 'flex';
}

function closePasswordModal() {
  document.getElementById('passwordModal').style.display = 'none';
  selectedTeacherId = null;
}

// Багшийн шинэ нууц үгийг сервер рүү хадгалах функц
async function savePassword() {
  const newPassword = document.getElementById('newPasswordInput').value.trim();

  // 1. Оруулсан утгуудыг шалгах
  if (!selectedTeacherId) {
    alert('Сонгосон багшийн ID олдсонгүй. Багшаа дахин сонгоно уу!');
    return;
  }

  if (!newPassword) {
    alert('Шинэ нууц үгээ оруулна уу!');
    return;
  }

  try {
    // 2. Сервер рүү хүсэлт илгээх
    const response = await fetch(`/api/admin/teachers/${selectedTeacherId}/password`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ newPassword })
    });

    // 3. Серверээс JSON ирсэн эсэхийг шалгах
    const contentType = response.headers.get("content-type");
    
    if (contentType && contentType.includes("application/json")) {
      const data = await response.json();
      
      if (response.ok && data.success) {
        alert(data.message || 'Нууц үг амжилттай солигдлоо!');
        closePasswordModal();
        fetchTeachers(); // Багш нарын жагсаалтыг шинэчлэх
      } else {
        alert(data.message || 'Нууц үг солиход алдаа гарлаа.');
      }
    } else {
      // Серверээс JSON биш HTML эсвэл текст алдаа буцаасан үед
      const errorText = await response.text();
      console.error("Серверийн хариу (JSON биш):", errorText);
      alert(`Серверээс алдаа буцлаа (Status Code: ${response.status}). Браузерын F12 Консолыг шалгана уу.`);
    }

  } catch (err) {
    console.error('Сүлжээний алдаа:', err);
    alert('Сүлжээний алдаа гарлаа! Сервер http://localhost:3000 дээр ажиллаж байгаа эсэхийг болон браузерын хаягийг шалгана уу.');
  }
}


  // 5. Багш устгах
  async function deleteTeacher(id, username) {
    if (!confirm(`Та "${username}" багшийг системээс устгахдаа итгэлтэй байна уу?`)) return;

    try {
      const res = await fetch(`/api/admin/teachers/${id}`, { method: 'DELETE' });
      const data = await res.json();

      if (data.success) {
        alert(data.message);
        fetchTeachers();
      } else {
        alert(data.message || 'Устгахад алдаа гарлаа.');
      }
    } catch (err) {
      alert('Сервертэй холбогдоход алдаа гарлаа.');
    }
  }

  // Системээс гарах
  function logout() {
    localStorage.clear();
    window.location.href = 'index.html';
  }

  // Хуудас ачаалагдахад багш нарын жагсаалтыг дуудна
  fetchTeachers();
</script>

</body>
</html>
