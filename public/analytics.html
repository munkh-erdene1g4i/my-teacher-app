<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дүн ба Анализ - Багшийн систем</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    /* Толгойн хэсэг ба Буцах товчлуур */
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 20px; }
    .header-bar h2 { color: #2c3e50; margin: 0; }
    .btn-back { background-color: #6c757d; color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; transition: 0.2s; border: none; cursor: pointer; }
    .btn-back:hover { background-color: #5a6268; }

    .card-list { display: grid; gap: 15px; margin-top: 20px; }
    .result-card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .result-info h3 { margin: 0 0 5px 0; color: #34495e; }
    .result-info p { margin: 3px 0; color: #7f8c8d; font-size: 14px; }
    
    .btn-group { display: flex; gap: 8px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: 0.2s; }
    .btn-view { background-color: #3498db; color: white; }
    .btn-excel { background-color: #27ae60; color: white; }
    .btn-delete { background-color: #e74c3c; color: white; }
    button:hover { opacity: 0.85; }

    /* Modal (Дэлгэрэнгүй цонх) */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; }
    .close-btn { float: right; font-size: 20px; cursor: pointer; font-weight: bold; color: #aaa; }
    .close-btn:hover { color: black; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: #f2f2f2; color: #333; }
    .badge-pass { background: #d4edda; color: #155724; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .badge-fail { background: #f8d7da; color: #721c24; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
  </style>
  
  <!-- Excel файл үүсгэх SheetJS сан -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h2>📊 Дүн ба Анализ</h2>
    <button class="btn-back" onclick="window.location.href='teacher.html'">← Буцах</button>
  </div>
  
  <div id="resultsList" class="card-list">
    <p>Өгөгдөл уншиж байна...</p>
  </div>
</div>

<!-- Дэлгэрэнгүй Анализ Харуулах Модал Цонх -->
<div id="detailsModal" class="modal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <h3 id="modalTitle">Шалгалтын дэлгэрэнгүй</h3>
    <p id="modalSubTitle" style="color: #666;"></p>
    
    <table>
      <thead>
        <tr>
          <th>Сурагч</th>
          <th>Оноо / Нийт</th>
          <th>Гүйцэтгэлийн хувь</th>
          <th>Төлөв</th>
        </tr>
      </thead>
      <tbody id="modalTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // localStorage-аос нэвтэрсэн багшийн ID-г авах (байхгүй бол t_1790057978939-г ашиглана)
  const user = JSON.parse(localStorage.getItem('user')) || {};
  const teacherId = user.id || 't_1790057978939';
  
  let globalResults = [];

  // 1. Серверээс багшийн дүнгүүдийг татаж харуулах
  async function loadResults() {
    try {
      const response = await fetch(`/api/teacher/results/${teacherId}`);
      globalResults = await response.json();
      
      const container = document.getElementById('resultsList');
      if (!Array.isArray(globalResults) || globalResults.length === 0) {
        container.innerHTML = '<p>Одоогоор хадгалагдсан дүн байхгүй байна.</p>';
        return;
      }

      container.innerHTML = globalResults.map(item => `
        <div class="result-card">
          <div class="result-info">
            <h3>${item.quizTitle || 'Нэргүй сорил'}</h3>
            <p>🏫 Анги: <b>${item.className || 'Заагаагүй'}</b> | 📅 Огноо: ${item.date || '-'}</p>
            <p>👥 Шалгалт өгсөн сурагч: ${item.records ? item.records.length : 0}</p>
          </div>
          <div class="btn-group">
            <button class="btn-view" onclick="openDetails('${item.id}')">👁️ Дэлгэрэнгүй</button>
            <button class="btn-excel" onclick="downloadExcel('${item.id}')">📥 Excel татах</button>
            <button class="btn-delete" onclick="deleteResult('${item.id}')">🗑️ Устгах</button>
          </div>
        </div>
      `).join('');
    } catch (error) {
      console.error('Алдаа:', error);
      document.getElementById('resultsList').innerHTML = '<p style="color:red">Мэдээлэл уншихад алдаа гарлаа.</p>';
    }
  }

  // 2. Дэлгэрэнгүй анализыг Попап цонхонд харуулах
  function openDetails(resultId) {
    const item = globalResults.find(r => r.id === resultId);
    if (!item) return;

    document.getElementById('modalTitle').innerText = item.quizTitle;
    document.getElementById('modalSubTitle').innerText = `Анги: ${item.className} | Огноо: ${item.date}`;

    const tbody = document.getElementById('modalTableBody');
    tbody.innerHTML = (item.records || []).map(r => {
      const total = r.total || 1;
      const score = r.score || 0;
      const percent = Math.round((score / total) * 100);
      const isPassed = percent >= 60;

      return `
        <tr>
          <td><b>${r.studentName || 'Сурагч'}</b></td>
          <td>${score} / ${total}</td>
          <td>${percent}%</td>
          <td><span class="${isPassed ? 'badge-pass' : 'badge-fail'}">${isPassed ? 'Тэнцсэн' : 'Тэнцээгүй'}</span></td>
        </tr>
      `;
    }).join('');

    document.getElementById('detailsModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('detailsModal').style.display = 'none';
  }

  // 3. Тухайн дүнг Excel (.xlsx) файл болгон татах
  function downloadExcel(resultId) {
    const item = globalResults.find(r => r.id === resultId);
    if (!item || !item.records) {
      alert('Татах өгөгдөл олдсонгүй!');
      return;
    }

    const excelData = item.records.map((r, index) => {
      const total = r.total || 1;
      const score = r.score || 0;
      const percent = Math.round((score / total) * 100);

      return {
        "№": index + 1,
        "Сурагчийн нэр": r.studentName || 'Нэргүй',
        "Зөв асуулт": score,
        "Нийт асуулт": total,
        "Гүйцэтгэлийн хувь": `${percent}%`,
        "Үнэлгээ": percent >= 60 ? 'Тэнцсэн' : 'Тэнцээгүй',
        "Огноо": item.date
      };
    });

    const worksheet = XLSX.utils.json_to_sheet(excelData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Шалгалтын Дүн");

    const fileName = `${item.className}_${item.quizTitle}_дүн.xlsx`;
    XLSX.writeFile(workbook, fileName);
  }

  // 4. Дүн устгах
  async function deleteResult(resultId) {
    if (!confirm('Та энэ шалгалтын дүнг устгахдаа итгэлтэй байна уу?')) return;

    try {
      const res = await fetch(`/api/teacher/results/${resultId}`, {
        method: 'DELETE'
      });
      const data = await res.json();

      if (data.success) {
        alert(data.message);
        loadResults();
      } else {
        alert(data.message || 'Устгахад алдаа гарлаа.');
      }
    } catch (err) {
      alert('Сервертэй холбогдоход алдаа гарлаа.');
    }
  }

  // Хуудас ачаалагдахад дүнг татна
  loadResults();
</script>

</body>
</html>
